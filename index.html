<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A little something for your birthday ♡</title>
  <meta name="description" content="A tiny birthday garden, made just for you.">
  <meta name="theme-color" content="#fbe4e4">
  <meta property="og:title" content="A little something for your birthday ♡">
  <meta property="og:description" content="Open your little gift.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌷%3C/text%3E%3C/svg%3E">

  <!-- Free Google Fonts. If they fail to load, the site falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Soft dreamy background -->
  <div class="bg" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div id="particles"></div>
  </div>

  <main>

    <!-- ============ 1. OPENING SCREEN ============ -->
    <section id="intro" class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title" class="intro-title">A little something for your birthday...</h1>

      <div class="envelope-stage" aria-hidden="true">
        <div class="envelope" id="envelope">
          <div class="env-back"></div>

          <div class="letter">
            <svg class="letter-icon" viewBox="0 0 40 40">
              <g fill="#f4b0c0" stroke="#e48aa0" stroke-width=".6">
                <ellipse cx="20" cy="10" rx="5.6" ry="8"/>
                <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(72 20 20)"/>
                <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(144 20 20)"/>
                <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(216 20 20)"/>
                <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(288 20 20)"/>
              </g>
              <circle cx="20" cy="20" r="4.2" fill="#f7e29a"/>
            </svg>
            <span class="letter-text">for you</span>
          </div>

          <div class="env-front-wrap"><div class="env-front"></div></div>

          <div class="env-flap">
            <div class="flap-face flap-front"></div>
            <div class="flap-face flap-back"></div>
            <div class="seal">
              <svg viewBox="0 0 40 40" width="18" height="18">
                <g fill="#fff4ee">
                  <ellipse cx="20" cy="10" rx="5.6" ry="8"/>
                  <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(72 20 20)"/>
                  <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(144 20 20)"/>
                  <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(216 20 20)"/>
                  <ellipse cx="20" cy="10" rx="5.6" ry="8" transform="rotate(288 20 20)"/>
                </g>
                <circle cx="20" cy="20" r="4" fill="#e9b94f"/>
              </svg>
            </div>
          </div>

          <div class="env-shadow"></div>
        </div>
      </div>
    </section>

    <!-- ============ 2 + 3 + 4. GARDEN, MESSAGE, SURPRISES ============ -->
    <section id="scene" class="scene" hidden tabindex="-1" aria-label="Your birthday garden">

      <div class="content">

        <!-- ★ THE BIRTHDAY MESSAGE: edit the two lines below to change it ★ -->
        <article id="card" class="card">
          <span class="tape" aria-hidden="true"></span>
          <h2 class="card-title" data-reveal>Happy Birthday! 🌷</h2>
          <p class="card-text" data-reveal>I hope your day is wonderful and filled with smiles and good memories. Enjoy your special day!</p>
          <p id="closing" class="closing">May your day bloom as beautifully as this garden.</p>
        </article>

        <div id="actions" class="actions"></div>

        <p id="toast" class="toast" role="status" aria-live="polite"></p>
      </div>

      <!-- Layered garden (flowers are generated by script.js) -->
      <div id="garden" class="garden" aria-hidden="true">
        <svg class="hills" viewBox="0 0 1440 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e6cf"/><stop offset="1" stop-color="#c6d9be"/></linearGradient>
            <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfd4b5"/><stop offset="1" stop-color="#a8c3a0"/></linearGradient>
            <linearGradient id="hillC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94b590"/><stop offset="1" stop-color="#7ea17b"/></linearGradient>
          </defs>
          <path fill="url(#hillA)" d="M0 58 C180 46 360 60 560 54 S980 42 1180 52 S1360 56 1440 50 L1440 100 L0 100Z"/>
          <path fill="url(#hillB)" d="M0 74 C200 66 380 78 620 72 S1000 64 1200 72 S1380 76 1440 70 L1440 100 L0 100Z"/>
          <path fill="url(#hillC)" d="M0 89 C240 83 480 91 720 87 S1200 83 1440 89 L1440 100 L0 100Z"/>
        </svg>
        <div class="flowers flowers-back" id="flowersBack"></div>
        <div class="flowers flowers-front" id="flowersFront"></div>
        <svg class="grass-front" id="grass" viewBox="0 0 1200 120" preserveAspectRatio="none"></svg>
      </div>

      <!-- Butterflies -->
      <div class="butterflies" aria-hidden="true">
        <div class="butterfly bf1">
          <svg viewBox="0 0 46 40">
            <g class="wing wing-l"><path class="w1" d="M23 19 C14 2 2 5 4 16 C5 24 15 24 23 21Z"/><path class="w2" d="M23 21 C14 22 8 30 12 35 C17 38 22 30 23 24Z"/></g>
            <g class="wing wing-r"><path class="w1" d="M23 19 C32 2 44 5 42 16 C41 24 31 24 23 21Z"/><path class="w2" d="M23 21 C32 22 38 30 34 35 C29 38 24 30 23 24Z"/></g>
            <ellipse cx="23" cy="22" rx="1.6" ry="8" fill="#7a5b66"/>
            <path d="M22.5 14 C20 8 18 7 16 7 M23.5 14 C26 8 28 7 30 7" stroke="#7a5b66" stroke-width=".9" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="butterfly bf2">
          <svg viewBox="0 0 46 40">
            <g class="wing wing-l"><path class="w1" d="M23 19 C14 2 2 5 4 16 C5 24 15 24 23 21Z"/><path class="w2" d="M23 21 C14 22 8 30 12 35 C17 38 22 30 23 24Z"/></g>
            <g class="wing wing-r"><path class="w1" d="M23 19 C32 2 44 5 42 16 C41 24 31 24 23 21Z"/><path class="w2" d="M23 21 C32 22 38 30 34 35 C29 38 24 30 23 24Z"/></g>
            <ellipse cx="23" cy="22" rx="1.6" ry="8" fill="#7a5b66"/>
            <path d="M22.5 14 C20 8 18 7 16 7 M23.5 14 C26 8 28 7 30 7" stroke="#7a5b66" stroke-width=".9" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="butterfly bf3">
          <svg viewBox="0 0 46 40">
            <g class="wing wing-l"><path class="w1" d="M23 19 C14 2 2 5 4 16 C5 24 15 24 23 21Z"/><path class="w2" d="M23 21 C14 22 8 30 12 35 C17 38 22 30 23 24Z"/></g>
            <g class="wing wing-r"><path class="w1" d="M23 19 C32 2 44 5 42 16 C41 24 31 24 23 21Z"/><path class="w2" d="M23 21 C32 22 38 30 34 35 C29 38 24 30 23 24Z"/></g>
            <ellipse cx="23" cy="22" rx="1.6" ry="8" fill="#7a5b66"/>
            <path d="M22.5 14 C20 8 18 7 16 7 M23.5 14 C26 8 28 7 30 7" stroke="#7a5b66" stroke-width=".9" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </section>

  </main>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;background:#fdf0e8;color:#8b4b5c;font:600 1.4rem Georgia,serif">
      This little gift needs JavaScript to open. Happy Birthday! 🌷
    </p>
  </noscript>

  <!-- Effects layers (petals, sparkles, wish glow) -->
  <div id="fx" class="fx" aria-hidden="true"></div>
  <div id="glow" class="glow" aria-hidden="true"></div>
</body>
</html>
